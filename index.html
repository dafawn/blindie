<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta name="description" content="Importe une playlist Spotify, lance un quiz musical et défie tes amis en direct !">
  <meta property="og:title" content="BLINDIE · Le blind test des playlists perso">
  <meta property="og:description" content="Importe une playlist Spotify, lance un quiz musical et défie tes amis en direct !">

  <meta property="og:image:height" content="630">

  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Icônes monochromes : elles héritent de la couleur du texte et se dessinent
       pareil sur tous les appareils, là où les emojis changent d'un système à
       l'autre et jurent avec la palette néon. -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-7H9v7H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M7 4.5v15a1 1 0 0 0 1.5.87l13-7.5a1 1 0 0 0 0-1.74l-13-7.5A1 1 0 0 0 7 4.5z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect fill="currentColor" stroke="none" x="5" y="5" width="14" height="14" rx="2"/></symbol>
    <symbol id="i-replay" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol>
    <symbol id="i-qr" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM21 14v4M17 21h4"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></symbol>
    <symbol id="i-login" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></symbol>
    <symbol id="i-headphones" viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9.9 9.9 0 0 1 0 14"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  </svg>
  <main class="screen">
    <div>
      <h1 class="logo">BLINDIE</h1>
      <div class="logo-sub">LE BLIND TEST DES PLAYLISTS PERSO</div>
    </div>

    <div class="card">
      <div class="col">
        <button id="btn-host" class="btn btn-primary">
          <svg class="ico" aria-hidden="true"><use href="#i-mic"/></svg> Créer une partie
        </button>

        <div class="row" style="margin: 0.5rem 0;">
          <hr style="flex:1; border:none; border-top:1px solid rgba(255,255,255,0.1);">
          <span class="muted">ou</span>
          <hr style="flex:1; border:none; border-top:1px solid rgba(255,255,255,0.1);">
        </div>

        <label class="field">
          <span class="field-label">Code de la partie</span>
          <input id="join-code" type="text" class="input-code" maxlength="6"
                 placeholder="CODE" autocomplete="off" inputmode="text"
                 autocapitalize="characters" spellcheck="false"
                 aria-describedby="error">
        </label>
        <label class="field">
          <span class="field-label">Ton pseudo</span>
          <input id="join-name" type="text" placeholder="Ex. Marion" maxlength="16"
                 autocomplete="nickname" aria-describedby="error">
        </label>
        <button id="btn-join" class="btn btn-secondary">
          <svg class="ico" aria-hidden="true"><use href="#i-login"/></svg> Rejoindre la partie
        </button>

        <div id="error" class="error hidden" role="alert"></div>
      </div>
    </div>

    <p class="muted center" style="max-width: 460px;">
      Créez le quiz avec votre playlist, invitez vos amis avec un code, et jouez tous ensemble.
    </p>
  </main>

  <footer class="legal-footer">
    Extraits audio fournis par <a href="https://music.apple.com" target="_blank" rel="noopener">Apple Music</a>.
    Blindie est un projet non-commercial.
  </footer>

  <script type="module">
    import { ensureAnonAuth } from './js/firebase.js';
    import { roomExists, joinRoom } from './js/room.js';
    import { appConfig } from './js/config.js';

    const codeInput = document.getElementById('join-code');
    const nameInput = document.getElementById('join-name');
    const errorEl = document.getElementById('error');

    // Pre-fill the join code from URL ?code=XXXXXX (so a shared URL works).
    const params = new URLSearchParams(window.location.search);
    const urlCode = params.get('code');
    if (urlCode) codeInput.value = urlCode.toUpperCase().slice(0, 6);

    codeInput.addEventListener('input', e => {
      e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    });

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.remove('hidden');
    }
    function clearError() { errorEl.classList.add('hidden'); }

    document.getElementById('btn-host').addEventListener('click', () => {
      window.location.href = './host.html';
    });

    const joinBtn = document.getElementById('btn-join');
    joinBtn.addEventListener('click', async () => {
      if (joinBtn.disabled) return;
      clearError();
      const code = codeInput.value.trim().toUpperCase();
      const name = nameInput.value.trim();
      if (code.length !== 6) return showError("Code à 6 caractères.");
      if (!name) return showError("Choisis un pseudo.");
      if (name.length > appConfig.maxNameLength) {
        return showError(`Pseudo trop long (${appConfig.maxNameLength} max).`);
      }

      joinBtn.disabled = true;
      try {
        const user = await ensureAnonAuth();
        const exists = await roomExists(code);
        if (!exists) return showError("Aucune partie avec ce code.");
        await joinRoom(code, user.uid, name);
        sessionStorage.setItem('blindie.roomCode', code);
        sessionStorage.setItem('blindie.playerName', name);
        localStorage.setItem('blindie.lastName', name);
        window.location.href = `./player.html?code=${code}`;
      } catch (err) {
        console.error(err);
        showError(err.message || "Impossible de rejoindre.");
      } finally {
        joinBtn.disabled = false;
      }
    });

    // Auto-fill last pseudo
    const savedName = localStorage.getItem('blindie.lastName');
    if (savedName) nameInput.value = savedName;
    nameInput.addEventListener('change', e => {
      localStorage.setItem('blindie.lastName', e.target.value);
    });

    // Submit on Enter from any field
    [codeInput, nameInput].forEach(el => {
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('btn-join').click();
      });
    });
  </script>
</body>
</html>
